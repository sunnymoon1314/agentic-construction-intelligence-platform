[package]
name = "risk_dashboard_leptos"
version = "0.1.0"
edition = "2021"
authors = ["Enterprise AEC Engineering Team"]
description = "High-Performance Leptos WebAssembly Dashboard for Quantity Surveyor Monte Carlo Simulation"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "Window", "Document"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.5"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"

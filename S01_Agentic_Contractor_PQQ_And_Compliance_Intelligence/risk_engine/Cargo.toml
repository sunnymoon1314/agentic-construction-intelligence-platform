[package]
name = "risk_engine"
version = "0.1.0"
edition = "2021"
authors = ["Enterprise AEC Engineering Team"]
description = "High-Performance Quantitative Monte Carlo Risk Sidecar for Construction Pre-Qualification"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.8"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
